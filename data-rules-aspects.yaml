dataplex-types.global.data-rules@Schema.Work_Order_ID:
  data:
    rules:
      - name: "non-null-work-order-id"
        type: "TEMPLATE_REFERENCE"
        templateReference:
          name: "projects/dataplex-templates/locations/global/entryGroups/rule-library/entries/non_null_expectation"
        dimension: COMPLETENESS
        threshold: 1.0

dataplex-types.global.data-rules@Schema.Antenna_Face:
  data:
    rules:
      - name: "range-antenna-face"
        type: "TEMPLATE_REFERENCE"
        templateReference:
          name: "projects/dataplex-templates/locations/global/entryGroups/rule-library/entries/range_expectation"
          values:
            min_value:
              value: "1"
            max_value:
              value: "3"
            strict_min_enabled:
              value: "false"
            strict_max_enabled:
              value: "false"
        dimension: VALIDITY
        threshold: 0.96

dataplex-types.global.data-rules@Schema.Post_Fix_State:
  data:
    rules:
      - name: "set-post-fix-state"
        type: "TEMPLATE_REFERENCE"
        templateReference:
          name: "projects/dataplex-templates/locations/global/entryGroups/rule-library/entries/set_expectation"
          values:
            values:
              value: "['Active','Inactive','Pending']"
        dimension: CONSISTENCY

dataplex-types.global.data-rules@Schema.Node_Identifier:
  data:
    rules:
      - name: "regex-node-identifier"
        type: "TEMPLATE_REFERENCE"
        templateReference:
          name: "projects/dataplex-templates/locations/global/entryGroups/rule-library/entries/row_condition_expectation"
          values:
            sql_expression:
              value: "REGEXP_CONTAINS(CAST(Node_Identifier AS STRING), '^5[0-9]{5}$')"
        dimension: VALIDITY
        threshold: 1.0