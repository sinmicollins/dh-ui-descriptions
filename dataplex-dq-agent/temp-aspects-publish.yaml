dataplex-types.global.data-rules@Schema.bi_channel_grp_cd:
  data:
    rules:
      - name: "non-null-bi-channel-grp-cd"
        type: "TEMPLATE_REFERENCE"
        templateReference:
          name: "projects/dataplex-templates/locations/global/entryGroups/rule-library/entries/non_null_expectation"
        dimension: "COMPLETENESS"
        threshold: 1.0
      - name: "valid-channel-group-codes"
        type: "TEMPLATE_REFERENCE"
        templateReference:
          name: "projects/dataplex-templates/locations/global/entryGroups/rule-library/entries/set_expectation"
          values:
            allowed_values:
              value: "['WEB', 'MOBILE', 'RETAIL', 'CALL_CENTER']"
        dimension: "CONSISTENCY"
        threshold: 1.0

