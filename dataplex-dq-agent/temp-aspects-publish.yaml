dataplex-types.global.data-rules@Schema.servreq_phone_num:
  data:
    rules:
      - name: "non-null-servreq-phone-num"
        type: "TEMPLATE_REFERENCE"
        templateReference:
          name: "projects/dataplex-templates/locations/global/entryGroups/rule-library/entries/non_null_expectation"
        dimension: "COMPLETENESS"
        threshold: 1.0
      - name: "valid-phone-format"
        type: "TEMPLATE_REFERENCE"
        templateReference:
          name: "projects/dataplex-templates/locations/global/entryGroups/rule-library/entries/row_condition_expectation"
          values:
            condition:
              value: "REGEXP_CONTAINS(servreq_phone_num, r'^[0-9]{10,15}$')"
        dimension: "VALIDITY"
        threshold: 1.0