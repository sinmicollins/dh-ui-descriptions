# Represents the google.cloud.dataplex.v1.DataQualitySpec schema with Catalog-based rules enabled
enableCatalogBasedRules: true

# Sampling & Export Configuration
samplingPercent: 99.0  # Evaluate over 100% of rows
postScanActions:
  bigqueryExport:
    # Writes detailed pass/fail statistics per rule execution to a BigQuery table
    resultsTable: "//bigquery.googleapis.com/projects/demo1-311322/datasets/mobile_data/tables/dq_results_table"

# Publish pass/fail results badges straight to the Google Cloud Console / Dataplex Catalog
catalogPublishingEnabled: true